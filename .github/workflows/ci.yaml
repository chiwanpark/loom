name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GUI_PACKAGES: pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libwayland-dev

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Install system packages
      run: |
        read -ra packages <<<"$GUI_PACKAGES"
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y "${packages[@]}"
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo fmt --all --check
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Install system packages
      run: |
        read -ra packages <<<"$GUI_PACKAGES"
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y "${packages[@]}"
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test --workspace --locked

  deny:
    name: Check licenses and sources
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # Advisories are left out: gpui's dependencies carry "unmaintained"
    # advisories that have no fix yet.
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check bans licenses sources

  build:
    name: Release build
    uses: ./.github/workflows/build.yaml
