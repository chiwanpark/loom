name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GUI_PACKAGES: pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libwayland-dev

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Install system packages
      run: |
        read -ra packages <<<"$GUI_PACKAGES"
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y "${packages[@]}"
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo fmt --all --check
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Install system packages
      run: |
        read -ra packages <<<"$GUI_PACKAGES"
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y "${packages[@]}"
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test --workspace --locked

  deny:
    name: Check licenses and sources
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # Advisories are left out: gpui's dependencies carry "unmaintained"
    # advisories that have no fix yet.
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check bans licenses sources

  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    # The installer runs as `sh` on other hosts, so it is checked as POSIX sh.
    - run: shellcheck scripts/*.sh && shellcheck --shell=sh scripts/install.sh
    - run: scripts/test-install.sh
    - run: scripts/test-release-version.sh

  android:
    name: Android app
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 30.0.16248370
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    # The runner has the Android SDK but not this platform, build tools, or
    # NDK; the versions match android/app/build.gradle.kts.
    - name: Install Android SDK packages
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
          "platforms;android-37" "build-tools;37.0.0" "ndk;$NDK_VERSION" >/dev/null
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk@4.1.2
    - uses: Swatinem/rust-cache@v2
      with:
        key: android
    - uses: gradle/actions/setup-gradle@v6
    # Without the shared signing key, the SDK's debug key signs the APK.
    - name: Build
      working-directory: android
      run: ./gradlew assembleDebug
    - uses: actions/upload-artifact@v7
      with:
        name: loom-android-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 7

  build:
    name: Release build
    uses: ./.github/workflows/build.yaml
