[package]
name = "loom-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
loom-config = { version = "0.1.0", path = "../loom-config" }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util", "net", "io-std", "signal"] }
wiremock = "0.6.5"
