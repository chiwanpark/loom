[package]
name = "loom-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The Rust core of the Loom Android client, exposed to Kotlin through UniFFI"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Builds the uniffi-bindgen tool that writes the Kotlin bindings.
bindgen = ["uniffi/cli"]

[dependencies]
base64 = "0.23.1"
loom-client = { path = "../loom-client" }
loom-crypto = { path = "../loom-crypto" }
loom-vt = { path = "../loom-vt" }
loom-view-model = { path = "../loom-view-model" }
# The TLS of wss:// relays. Nothing else in the app picks rustls's crypto, so
# the core names one; ring builds with the NDK alone.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Syntax highlighting of files and diffs: TextMate grammars, bat's collection
# of them, and a pure Rust regex engine, which builds with the NDK alone.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
uniffi = "0.32"

[dev-dependencies]
async-trait = "0.1.92"
aws-lc-rs = "1.19.0"
axum = "0.8.9"
futures = "0.3.34"
loom-agent = { path = "../loom-agent" }
loom-agent-core = { path = "../loom-agent-core" }
loom-config = { path = "../loom-config" }
loom-llm = { path = "../loom-llm" }
loom-oracle = { path = "../loom-oracle" }
loom-relay = { path = "../loom-relay" }
tempfile = "3.27.0"
tokio-util = "0.7.20"

# Not the workspace lints: UniFFI's generated scaffolding is unsafe code,
# which the workspace forbids. It may allow it locally; our code may not.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
