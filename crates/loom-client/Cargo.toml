[package]
name = "loom-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
loom-config = { version = "0.1.0", path = "../loom-config" }
loom-crypto = { version = "0.1.0", path = "../loom-crypto" }
loom-proto = { version = "0.1.0", path = "../loom-proto" }
loom-transport = { version = "0.1.0", path = "../loom-transport" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
