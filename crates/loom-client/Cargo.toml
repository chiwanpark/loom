[package]
name = "loom-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "loom-oracle-cli"
path = "src/bin/loom-oracle-cli.rs"
required-features = ["cli"]

[[test]]
name = "oracle_cli"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:loom-version", "dep:qrcode", "serde/derive", "tokio/rt-multi-thread", "tokio/signal"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
loom-config = { path = "../loom-config" }
loom-crypto = { path = "../loom-crypto" }
loom-oracle-proto = { path = "../loom-oracle-proto" }
loom-proto = { path = "../loom-proto" }
loom-transport = { path = "../loom-transport" }
loom-version = { path = "../loom-version", optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }
rand = "0.10.3"
serde = "1.0.229"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
loom-oracle = { path = "../loom-oracle" }
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
