version: 1

allowed_roots:
- ~/src
- ~/work

relay:
  enabled: true
  url: wss://relay.example.com
  cloudflare_access:
    client_id_env: LOOM_CF_ACCESS_CLIENT_ID
    client_secret_env: LOOM_CF_ACCESS_CLIENT_SECRET

socket:
  dir: null

storage:
  data_dir: ~/.local/share/loom

lifecycle:
  default_workspace: ~/src

instructions:
  max_bytes: 64KiB
  # Replaces Loom's built-in instructions. AGENTS.md files and the
  # environment section are still appended.
  # system_prompt: |
  #   You are a careful coding agent.

skills:
  enabled: true
  # More directories of skills. The agent also looks in
  # <workspace>/.loom/skills, <workspace>/.agents/skills,
  # ~/.config/loom/skills, and ~/.agents/skills.
  paths:
  - ~/shared-skills
  disabled:
  - slow-review

llm:
  default_model: openai/gpt-5
  providers:
    openai:
      auth: chatgpt
    openai-codex:
      auth: codex_oauth
    local:
      type: openai-compatible
      base_url: http://127.0.0.1:11434/v1
      api: chat
      models: [qwen3-coder]

tools:
  read:
    max_lines: 2000
    max_bytes: 50KiB
  shell:
    program: /bin/bash
    timeout: 10m
    pty: false

terminal:
  shell: null

policy:
  default: ask
  rules:
  - tool: read
    action: allow
  - tool: shell
    command_prefix: ["git status", "git diff", "cargo check", "cargo test"]
    action: allow
  - tool: shell
    command_prefix: ["rm -rf /", "sudo"]
    action: deny

# The environment of shell tool calls and terminals. Variables are built in
# this order: the agent's environment, `inherit`, the default excludes
# (names with KEY, SECRET, TOKEN, or PASSWORD), `exclude`, the env file,
# `set`, and `include_only`.
environment:
  inherit: core                  # all (default), core, or none
  ignore_default_excludes: false
  exclude:
  - AWS_*
  # include_only: [PATH, HOME, AWS_*]
  set:
    RUST_BACKTRACE: "1"
  env_file: .env                 # relative to the workspace; null for none
  # The model never sees the values of the env file and `set`, or of the
  # agent's variables with secret names. Values in tool output show as
  # [REDACTED:<NAME>].
  redaction:
    enabled: true
    allow: [AWS_REGION, RUST_BACKTRACE]

# Sessions in a git worktree of their own get it in
# <dir>/<workspace-hash>/<session>.
worktrees:
  dir: ~/.config/loom/worktrees

sandbox:
  backend: landlock
  network: false
  writable:
  - ~/.cargo
  - ~/.cache
  max_output: 1MiB

context:
  max_tool_output_tokens: 8000
  window_tokens: 200000
  compaction_threshold: 0.8

logging:
  level: info


# OpenTelemetry export of session metrics and events (restart to apply).
# Unset connection settings fall back to the OTEL_EXPORTER_OTLP_* variables.
# `loom-agent config fetch-telemetry` prints this section from the settings
# your organization publishes for Claude Code.
# telemetry:
#   enabled: true
#   protocol: http/protobuf        # or grpc, http/json
#   endpoint: http://localhost:4318
#   headers:
#     authorization: Bearer <token>
#   prefix: loom                   # claude_code matches Claude Code's names
#   log_user_prompts: false
#   log_tool_details: false
