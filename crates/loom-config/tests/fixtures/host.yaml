driver: incus
data_dir: /var/lib/loom-host
incus:
  url: https://incus.example.com:8443
  project: loom
  pool: ssd
  network: incusbr0
agent:
  path: ~/bin/loom-agent
rules:
  max_codespaces: 8
  directories:
  - /srv/projects
  host_user:
    uid: 1000
    gid: 1000
  network:
    isolate: true
    acls: [loom-codespaces]
    default_egress: allow
git_proxy:
  listen: 10.0.0.1:7440
report_interval: 2m
logging:
  level: info
