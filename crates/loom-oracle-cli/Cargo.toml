[package]
name = "loom-oracle-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "loom-oracle-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
loom-client = { path = "../loom-client" }
loom-config = { path = "../loom-config" }
loom-crypto = { path = "../loom-crypto" }
loom-version = { path = "../loom-version" }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true

[dev-dependencies]
loom-config = { path = "../loom-config" }
loom-oracle = { path = "../loom-oracle" }
loom-oracle-proto = { path = "../loom-oracle-proto" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
