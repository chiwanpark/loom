[package]
name = "loom-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
http = "1.5.0"
humantime = "2.4.0"
loom-agent-core = { version = "0.1.0", path = "../loom-agent-core" }
loom-config = { version = "0.1.0", path = "../loom-config" }
loom-proto = { version = "0.1.0", path = "../loom-proto" }
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["metrics", "logs", "http-proto", "http-json", "grpc-tonic", "reqwest-blocking-client", "tls-aws-lc", "tls-roots"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "logs", "testing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true
