[package]
name = "loom-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "loom-oracle"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["tokio", "http1"] }
blake3 = "1.8.7"
bytes = "1.12.1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
loom-config = { path = "../loom-config" }
loom-crypto = { path = "../loom-crypto" }
loom-github = { path = "../loom-github" }
loom-llm = { path = "../loom-llm" }
loom-oracle-proto = { path = "../loom-oracle-proto" }
loom-proto = { path = "../loom-proto" }
loom-relay = { path = "../loom-relay" }
loom-transport = { path = "../loom-transport" }
loom-version = { path = "../loom-version" }
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
loom-client = { path = "../loom-client" }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
