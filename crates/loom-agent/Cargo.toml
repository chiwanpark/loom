[package]
name = "loom-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "loom-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
loom-agent-core = { path = "../loom-agent-core" }
loom-client = { path = "../loom-client" }
loom-config = { path = "../loom-config" }
loom-crypto = { path = "../loom-crypto" }
loom-github = { path = "../loom-github" }
loom-llm = { path = "../loom-llm" }
loom-proto = { path = "../loom-proto" }
loom-telemetry = { path = "../loom-telemetry" }
loom-tools = { path = "../loom-tools" }
loom-transport = { path = "../loom-transport" }
loom-update = { path = "../loom-update" }
loom-version = { path = "../loom-version" }
nix = { version = "0.31.3", features = ["signal"] }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1.92"
flate2 = "1.1.11"
futures = "0.3.34"
loom-config = { path = "../loom-config" }
loom-crypto = { path = "../loom-crypto" }
loom-host = { path = "../loom-host" }
loom-llm = { path = "../loom-llm" }
loom-oracle = { path = "../loom-oracle" }
loom-relay = { path = "../loom-relay" }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4"
tempfile = "3.27.0"
tokio-util = "0.7.20"
wiremock = "0.6"
