[package]
name = "loom-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "loom-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
bytes = "1.12.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
loom-agent-core = { version = "0.1.0", path = "../loom-agent-core" }
loom-config = { version = "0.1.0", path = "../loom-config" }
loom-proto = { version = "0.1.0", path = "../loom-proto" }
loom-transport = { version = "0.1.0", path = "../loom-transport" }
nix = { version = "0.31.3", features = ["signal"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
loom-client = { version = "0.1.0", path = "../loom-client" }
loom-llm = { version = "0.1.0", path = "../loom-llm" }
serde_json = "1.0.154"
tempfile = "3.27.0"
