[package]
name = "loom-agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures = "0.3.34"
loom-config = { version = "0.1.0", path = "../loom-config" }
loom-llm = { version = "0.1.0", path = "../loom-llm" }
loom-proto = { version = "0.1.0", path = "../loom-proto" }
loom-tools = { version = "0.1.0", path = "../loom-tools" }
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util", "io-std", "io-util", "signal"] }
