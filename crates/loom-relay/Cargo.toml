[package]
name = "loom-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "tokio", "http1", "http2"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
loom-config = { path = "../loom-config" }
loom-crypto = { path = "../loom-crypto" }
loom-proto = { path = "../loom-proto" }
loom-version = { path = "../loom-version" }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
bytes = "1.12.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
loom-transport = { path = "../loom-transport" }
tempfile = "3.27.0"
tokio-util = "0.7.20"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wiremock = "0.6.5"
