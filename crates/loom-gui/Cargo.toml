[package]
name = "loom-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["font-kit", "wayland"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["font-kit", "wayland", "runtime_shaders"] }
gpui-component = { version = "=0.9.1", default-features = false, features = ["tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-go", "tree-sitter-html", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-sql", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml"] }
gpui-kit-assets = "=0.9.1"
hayro = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
loom-client = { path = "../loom-client" }
loom-config = { path = "../loom-config" }
loom-update = { path = "../loom-update" }
loom-version = { path = "../loom-version" }
loom-view-model = { path = "../loom-view-model" }
loom-vt = { path = "../loom-vt" }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.3"

[lints]
workspace = true

[dev-dependencies]
loom-agent = { path = "../loom-agent" }
loom-agent-core = { path = "../loom-agent-core" }
loom-llm = { path = "../loom-llm" }
loom-oracle = { path = "../loom-oracle" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"
tokio-util = "0.7.20"
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["font-kit", "wayland", "test-support"] }
