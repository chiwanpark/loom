# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# Loom is GPL-3.0-or-later, so every dependency must be available under a
# GPL-3.0-compatible license (docs/ARCHITECTURE.md, Section 7.2). Run:
#
#   cargo deny check licenses sources
#
# A dual-licensed crate passes when at least one of its options is allowed, so
# for example "Apache-2.0 OR GPL-2.0-only" is accepted through Apache-2.0.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# Loom's own crates are not published; their license is checked by review.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
